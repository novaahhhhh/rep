<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Take Tren">
<title>Take Tren</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="img/splash.jpg" as="image">
<link rel="preload" href="fonts/barlow-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-800.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;font-display:swap;src:url(fonts/inter-700.woff2) format("woff2")}
:root{
  --bg:#000;--c1:#121214;--c2:#1c1c1f;--c3:#26262b;--line:#1f1f23;
  --tx:#f4f4f5;--tx2:#d4d4d8;--mu:#a1a1aa;--mu2:#8b8b94;--dim:#52525b;
  --ac:#a78bfa;--on:#1a0f3a;--act:#c4b5fd;--ac2:#ddd6fe;--tint:rgba(167,139,250,.14);--tint2:rgba(167,139,250,.22);--acdeep:#16121f;--acline:#3b3354;
  --gold:#f2c14e;--goldt:rgba(242,193,78,.14);--good:#5cc98a;--bad:#fca5a5;
  --d:"Barlow Condensed",system-ui,sans-serif;--f:Inter,system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
input,textarea{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hidden{display:none!important}
#app{max-width:520px;margin:0 auto;padding:calc(20px + var(--st)) 16px calc(110px + var(--sb))}
#app.page{padding-bottom:calc(110px + var(--sb))}
#app.page.nobar{padding-bottom:calc(40px + var(--sb))}
.col{display:flex;flex-direction:column}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.row{display:flex;align-items:center;gap:10px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}.f1{flex:1;min-width:0}.nf{flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.d{font-family:var(--d);font-weight:700;letter-spacing:.005em}
.h1{font:800 40px/1.05 var(--d);margin:0}
.h2{font:700 26px/1.1 var(--d);margin:0}
.h3{font:700 21px/1.1 var(--d);margin:0}
.big{font:800 72px/.85 var(--d)}
.num{font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}.act{color:var(--act)}.gold{color:var(--gold)}.good{color:var(--good)}.bad{color:var(--bad)}
.sm{font-size:13px}.xs{font-size:12px}.b6{font-weight:600}.b7{font-weight:700}
.lbl{font-size:13px;color:var(--mu);font-weight:600}
.card{background:var(--c1);border-radius:22px;padding:16px}
.card.tight{padding:12px 14px}
.cardlink{display:flex;align-items:center;gap:12px;background:var(--c1);border-radius:18px;min-height:64px;padding:8px 12px 8px 16px;text-align:left;width:100%}
.btn{height:52px;border-radius:16px;background:var(--ac);color:var(--on);font-weight:700;font-size:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.g{background:var(--c2);color:var(--tx);font-weight:600}
.btn.dash{background:none;border:1.5px dashed var(--dim);color:var(--tx2);font-weight:600}
.btn.sm{height:44px;border-radius:14px;font-size:15px;padding:0 16px}
.btn.danger{background:var(--c2);color:var(--bad);font-weight:600}
.btn.w{width:100%}
.lk{color:var(--act);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.ib{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.ib.bg{background:var(--c1)}
.chip{height:40px;padding:0 14px;border-radius:20px;background:var(--c2);color:var(--tx2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--on);font-weight:700}
.chip.out{background:var(--tint);color:#fff;box-shadow:inset 0 0 0 1.5px var(--ac)}
.chip.dash{background:none;box-shadow:inset 0 0 0 1.5px var(--dim)}
.chip.s{height:32px;padding:0 12px;font-size:13px;border-radius:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.hs::-webkit-scrollbar{display:none}
.inp{height:52px;border-radius:14px;border:2px solid transparent;background:var(--c1);color:var(--tx);padding:0 14px;width:100%;font-size:17px;font-weight:600;outline:none}
.inp:focus{border-color:var(--ac)}
textarea.inp{height:88px;padding:12px 14px;font-size:15px;font-weight:500;resize:none;line-height:1.45}
.stepper{display:flex;align-items:center;background:var(--c2);border-radius:14px;flex:none}
.stepper button{width:44px;height:44px;font-size:22px;font-weight:600;color:var(--tx)}
.stepper span,.stepper input{min-width:48px;width:64px;text-align:center;font:700 22px var(--d);background:none;border:0;outline:none;color:var(--tx)}
.sw{width:52px;height:32px;border-radius:16px;background:#3f3f46;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#d4d4d8;transition:left .15s,background .15s}
.sw[aria-checked=true]{background:var(--ac)}.sw[aria-checked=true]::after{left:24px;background:var(--on)}
.list{background:var(--c1);border-radius:18px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;min-height:60px}
.li+.li{border-top:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;min-height:48px;margin-left:-10px}
.top.sb{margin-right:-10px}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0a0b;border-top:1px solid var(--line);padding-bottom:var(--sb)}
#nav .in{max-width:520px;margin:0 auto;height:68px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--mu)}
#nav button.on{color:var(--act);font-weight:700}
#nav .home{justify-content:flex-start}
#nav .home .c{width:62px;height:62px;border-radius:31px;background:var(--c2);color:var(--tx2);margin-top:-22px;box-shadow:0 0 0 6px var(--bg);display:flex;align-items:center;justify-content:center;transition:background .15s}
#nav .home.on{color:#fff}
#nav .home.on .c{background:var(--ac);color:var(--on)}
.dotw{position:relative;display:flex}.dotw i{position:absolute;top:-2px;right:-6px;width:9px;height:9px;border-radius:5px;background:var(--ac);box-shadow:0 0 0 2px #0a0a0b}
#resume{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--sb));z-index:19;max-width:496px;margin:0 auto;height:64px;border-radius:20px;background:#1c1a24;border:1px solid #332c47;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;text-align:left}
#resume .pulse{width:10px;height:10px;border-radius:5px;background:var(--ac);box-shadow:0 0 0 4px rgba(167,139,250,.25);flex:none;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px rgba(167,139,250,0)}}
/* home */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk span{height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--c2);color:var(--mu2)}
.wk span.on{background:var(--ac);color:var(--on)}.wk span.today{background:none;box-shadow:inset 0 0 0 2px var(--ac);color:#fff}.wk span.on.today{background:var(--ac);color:var(--on)}
.stat{background:var(--c1);border-radius:20px;padding:14px 16px}
.stat b{display:block;font:700 38px/1.05 var(--d);margin-top:4px}
.pr{border:1px solid rgba(242,193,78,.45);background:#141210;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:14px}
.pr .ic{width:44px;height:44px;border-radius:22px;background:var(--goldt);display:flex;align-items:center;justify-content:center;flex:none}
.day{background:var(--c1);border-radius:22px;padding:14px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s}
.day.press{transform:scale(.97)}
.day .n{font:700 26px/1.05 var(--d);word-break:break-word}
.play{width:44px;height:44px;border-radius:22px;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
.legend{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--mu)}
.legend i{width:20px;height:10px;border-radius:3px;display:block}
/* workout */
.wtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clock{font:800 44px/1 var(--d);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--c2);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .25s}
.ex{background:var(--c1);border-radius:22px}
.exh{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px;width:100%;text-align:left;min-height:64px}
.ck{width:30px;height:30px;border-radius:15px;box-shadow:inset 0 0 0 2px #3f3f46;display:flex;align-items:center;justify-content:center;flex:none;color:var(--on)}
.ck.on{background:var(--ac);box-shadow:none}
.exb{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.note{display:flex;align-items:flex-start;gap:8px;background:var(--c2);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--tx2);line-height:1.4}
.note svg{flex:none;margin-top:1px}
.tbl{display:grid;gap:6px;align-items:center}
.th{font-size:12px;color:var(--mu2);font-weight:600;padding-top:2px}
.th.c{text-align:center}
.srow{display:grid;gap:6px;align-items:center;height:52px;border-radius:14px;padding:0 2px;position:relative;transition:background .15s,transform .15s}
.srow.done{background:var(--tint)}
.srow.prr{background:rgba(242,193,78,.12)}
.srow.out{transform:translateX(-110%);opacity:0;transition:transform .2s,opacity .2s}
.sbadge{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;justify-self:center;background:var(--c2)}
.sbadge.wu{background:none;box-shadow:inset 0 0 0 1.5px #71717a;color:var(--mu);border-radius:10px}
.sbadge.wu{background-image:none}
.last{font-size:14px;color:var(--mu2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{width:100%;height:40px;border-radius:10px;border:0;background:var(--c2);text-align:center;font:700 22px var(--d);color:var(--tx);outline:none;padding:0}
.cell:focus{box-shadow:inset 0 0 0 2px var(--ac)}
.cell::placeholder{color:#5b5b63}
.srow.done .cell{background:transparent}
.tick{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;justify-self:center;box-shadow:inset 0 0 0 2px #52525b;color:#52525b}
.tick.on{background:var(--ac);color:var(--on);box-shadow:none}
.tick.gold{background:var(--gold);color:#1a1405;box-shadow:none}
.plates{font-size:13px;color:var(--mu);padding:2px 4px}
.ssg{border:1.5px solid var(--acline);background:#0f0d16;border-radius:24px;padding:8px;display:flex;flex-direction:column;gap:8px}
.ssl{display:flex;align-items:center;gap:6px;color:var(--act);font-size:13px;font-weight:600;padding:2px 8px 0}
.restp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sb));box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:30;background:#1c1a24;border:1px solid var(--acline);border-radius:22px;height:44px;padding:0 6px 0 16px;display:flex;align-items:center;gap:10px;font-weight:700}
/* progress */
.seg{display:flex;gap:8px}
.mrow{display:grid;grid-template-columns:100px minmax(0,1fr) 30px;gap:10px;align-items:center;min-height:26px}
.mrow .tr{height:10px;border-radius:5px;background:var(--c2);overflow:hidden}.mrow .tr i{display:block;height:100%;background:var(--ac);border-radius:5px}
.coll{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left}
.coll svg{transition:transform .2s;flex:none}.coll[aria-expanded=true] svg{transform:rotate(180deg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--mu2);text-align:center;font-weight:600}
.cal button{height:40px;border-radius:12px;font-size:14px;font-weight:600;color:#71717a;background:var(--c2)}
.cal button.on{background:var(--ac);color:var(--on)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ac);color:#fff}
.cal button.fut{background:none;color:#3f3f46}
.cal button.sel{outline:2px solid #fff;outline-offset:1px}
.rec{background:var(--c2);border-radius:14px;padding:10px 12px}
.rec b{display:block;font:700 22px var(--d)}
.hset{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:9px;font:700 16px var(--d);background:var(--c2)}
.hset.wu{background:none;box-shadow:inset 0 0 0 1px #52525b;color:var(--mu)}
.hset.p{background:var(--goldt);color:var(--gold)}
/* sheets */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);animation:fd .18s}
#sheet .sc{background:#0e0e10;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:8px 16px calc(16px + var(--sb));max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:#3f3f46;margin:4px auto 10px;flex:none}
#sheet .scroll{overflow-y:auto;flex:1 1 auto;min-height:0;margin:0 -16px;padding:0 16px}
@keyframes up{from{transform:translateY(40%)}}@keyframes fd{from{opacity:0}}
.mi{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 6px;width:100%;text-align:left;font-size:16px;font-weight:500;border-radius:12px}
.mi:active{background:var(--c2)}
.mi svg{color:var(--mu);flex:none}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;width:100%;text-align:left;min-height:62px;box-shadow:inset 0 0 0 1.5px transparent}
.pick.on{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--ac)}
.th1{width:46px;height:46px;border-radius:12px;background:var(--c2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 20px var(--d);color:var(--mu)}
.th1 img{width:100%;height:100%;object-fit:cover}
.photo{height:200px;border-radius:22px;background:var(--c1);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mu);font-size:14px;width:100%;box-shadow:inset 0 0 0 1.5px #3f3f46}
.photo.has{box-shadow:none}
.photo img{width:100%;height:100%;object-fit:cover}
.radio{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 14px;border-radius:16px;background:var(--c1);box-shadow:inset 0 0 0 1.5px transparent;width:100%;text-align:left}
.radio.on{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--ac)}
.radio .dot{width:20px;height:20px;border-radius:10px;box-shadow:inset 0 0 0 2px #71717a;flex:none}
.radio.on .dot{box-shadow:inset 0 0 0 6px var(--ac)}
.next{background:var(--acdeep);border:1px solid var(--acline);border-radius:22px;padding:16px}
.tcard{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-height:64px;text-align:left;background:var(--c1);box-shadow:inset 0 0 0 1.5px transparent}
.tcard.on{background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--ac)}
.wgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wgrid button{height:44px;border-radius:12px;font:700 18px var(--d);background:var(--c2)}
.wgrid button.off{background:none;color:#52525b;box-shadow:inset 0 0 0 1.5px #3f3f46;text-decoration:line-through}
.prow{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 4px}
.prow+.prow{border-top:1px solid var(--line)}
.disc{border-radius:50%;display:block;box-shadow:inset 0 0 0 4px rgba(0,0,0,.25)}
.drag{touch-action:none}
.dragging{opacity:.9;transform:scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.6);position:relative;z-index:5}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#000;border-top:1px solid var(--line);padding:12px 16px calc(14px + var(--sb))}.fbar .in{max-width:488px;margin:0 auto;display:flex;gap:10px}
.srow{touch-action:pan-y}
#toast{position:fixed;left:50%;top:calc(12px + var(--st));transform:translate(-50%,-180%);background:#1d1b24;border:1px solid var(--ac);padding:12px 16px;border-radius:16px;font-weight:600;z-index:60;transition:transform .3s;max-width:calc(100% - 32px);width:max-content;display:flex;align-items:center;gap:12px;font-size:15px}
#toast{visibility:hidden;transition:transform .3s,visibility 0s .3s}#toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .3s}
#toast button{color:var(--act);font-weight:700;min-height:32px}
#splash{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:99;transition:opacity .35s}
#splash img{width:min(92vw,440px);height:auto;border-radius:18px;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" data-skip><img src="img/splash.jpg" alt="Life is short. Make it shorter. Take tren." fetchpriority="high"></div>
<main id="app"></main>
<button id="resume" class="hidden" data-a="tab" data-v="work"></button>
<nav id="nav" aria-label="Main"><div class="in"></div></nav>
<div id="sheet" class="hidden"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileBackup" accept=".json,application/json,text/plain" hidden>
<script src="body.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="actions.js"></script>
</body>
</html>
